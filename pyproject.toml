[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mazememory"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.40.0",
    "supabase>=2.0.0",
    "python-dotenv>=1.0.0",
    "matplotlib>=3.10.9",
    "pillow>=12.2.0",
    "jupyter>=1.1.1",
    "nbconvert>=7.17.1",
    "pandas>=2.3.3",
    "seaborn>=0.13.2",
    "scipy>=1.15.3",
    "statsmodels>=0.14.6",
    "tabulate>=0.10.0",
]

[project.optional-dependencies]
app = [
    "streamlit>=1.35.0",
    "plotly>=5.20.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
